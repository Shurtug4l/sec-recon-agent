# Enables auto-merge on Dependabot PRs that clear the policy below. Auto-merge
# does NOT bypass branch protection: GitHub merges only once every required
# check passes, so a red CI leaves the PR sitting open exactly as before.
#
# Why this exists: under linear-history + up-to-date-required, merges
# serialize. Each manual merge leaves every other open PR BEHIND, so a batch of
# N costs N merges plus N-1 rebases. With auto-merge enabled, GitHub does the
# update-and-merge cascade itself (the repo already has allow_update_branch and
# allow_auto_merge on).
#
# Policy:
#   - patch and minor only; majors are always a human decision
#   - never the schema-emitting set, whose bumps can change the emitted tool
#     and report JSON schemas and trip the record-replay cassette gate
#     (~$3 to re-record). A grouped PR containing any of them is skipped whole.
#
# Which identity arms auto-merge, and why it matters: the eventual merge is
# attributed to whoever enabled auto-merge, and events created by GITHUB_TOKEN
# do not start workflow runs. Armed with GITHUB_TOKEN, no Dependabot merge ever
# triggered an `on: push` workflow here (verified 2026-09-21 on five commits):
# docker-scan's "scan main on dependency merges", sbom-gate, the non-PR
# attestations and the Pages redeploy all silently skipped exactly the merges
# they exist for, while merges armed with the owner's token on the same day
# ran all of them. The attribution rule is observed, not documented; what
# GitHub documents is that App installation tokens and PATs trigger events
# while GITHUB_TOKEN does not. The App token is therefore expected to behave
# like the owner's: the step summary names the arming identity on every run,
# and the first Dependabot merge after setup is the confirmation.
#
# The App is optional by construction: without AUTOMERGE_APP_CLIENT_ID the job
# falls back to GITHUB_TOKEN and says so in the step summary, so this workflow
# never breaks the queue over a missing credential.
#
# Security note: this runs on pull_request_target, which executes in the BASE
# repo context with write permissions and, with the App configured, a private
# key in reach. It therefore never checks out, builds, or otherwise executes PR
# code, and every value derived from the PR is passed through the environment
# rather than interpolated into a shell body. The job requires Dependabot as
# BOTH the PR author and the triggering actor: a human push onto a Dependabot
# branch does not re-arm anything. The App token is minted only after the
# policy gate passes, scoped to this repository and to contents + pull-requests
# write (what enabling auto-merge needs), lives one hour at most, and is
# revoked by the action's post step. No `workflows` permission: GITHUB_TOKEN
# can never hold it and still auto-merged PRs that edit .github/workflows, so
# the server-side merge does not depend on it.

name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write # enable auto-merge on the PR (GITHUB_TOKEN fallback path)
  pull-requests: write # required by gh pr merge --auto

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the auto-merge policy
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail

          # Bumps that can move the emitted JSON schemas behind the cassette gate.
          GUARDED="pydantic-ai pydantic-ai-slim pydantic-settings fastapi mcp"

          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *)
              echo "hold: update-type is '$UPDATE_TYPE', not patch or minor" >> "$GITHUB_STEP_SUMMARY"
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          IFS=',' read -ra deps <<< "$DEP_NAMES"
          for raw in "${deps[@]}"; do
            dep="$(printf '%s' "$raw" | tr -d '[:space:]')"
            [ -n "$dep" ] || continue
            for guarded in $GUARDED; do
              if [ "$dep" = "$guarded" ]; then
                echo "hold: '$dep' is in the schema-emitting guard set" >> "$GITHUB_STEP_SUMMARY"
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done

          echo "auto-merge armed for $UPDATE_TYPE: $DEP_NAMES" >> "$GITHUB_STEP_SUMMARY"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Mint the App installation token
        id: app-token
        if: steps.gate.outputs.eligible == 'true' && vars.AUTOMERGE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          # owner/repositories left empty on purpose: the token is then scoped
          # to the current repository only.
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        if: steps.gate.outputs.eligible == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_SOURCE: ${{ github.secret_source }}
        run: |
          set -euo pipefail
          if [ -n "$APP_TOKEN" ]; then
            export GH_TOKEN="$APP_TOKEN"
            echo "armed by: GitHub App (push workflows will run on merge); secret source: $SECRET_SOURCE" >> "$GITHUB_STEP_SUMMARY"
          else
            export GH_TOKEN="$FALLBACK_TOKEN"
            echo "armed by: GITHUB_TOKEN fallback (no push workflows on merge); secret source: $SECRET_SOURCE" >> "$GITHUB_STEP_SUMMARY"
          fi
          gh pr merge --auto --rebase "$PR_URL"
