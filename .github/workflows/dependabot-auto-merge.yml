# Enables auto-merge on Dependabot PRs that clear the policy below. Auto-merge
# does NOT bypass branch protection: GitHub merges only once every required
# check passes, so a red CI leaves the PR sitting open exactly as before.
#
# Why this exists: under linear-history + up-to-date-required, merges
# serialize. Each manual merge leaves every other open PR BEHIND, so a batch of
# N costs N merges plus N-1 rebases. With auto-merge enabled, GitHub does the
# update-and-merge cascade itself (the repo already has allow_update_branch and
# allow_auto_merge on).
#
# Policy:
#   - patch and minor only; majors are always a human decision
#   - never the schema-emitting set, whose bumps can change the emitted tool
#     and report JSON schemas and trip the record-replay cassette gate
#     (~$3 to re-record). A grouped PR containing any of them is skipped whole.
#
# Security note: this runs on pull_request_target, which executes in the BASE
# repo context with write permissions. It therefore never checks out, builds,
# or otherwise executes PR code, and every value derived from the PR is passed
# through the environment rather than interpolated into a shell body.

name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write # enable auto-merge on the PR
  pull-requests: write # required by gh pr merge --auto

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the auto-merge policy
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail

          # Bumps that can move the emitted JSON schemas behind the cassette gate.
          GUARDED="pydantic-ai pydantic-ai-slim pydantic-settings fastapi mcp"

          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *)
              echo "hold: update-type is '$UPDATE_TYPE', not patch or minor" >> "$GITHUB_STEP_SUMMARY"
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          IFS=',' read -ra deps <<< "$DEP_NAMES"
          for raw in "${deps[@]}"; do
            dep="$(printf '%s' "$raw" | tr -d '[:space:]')"
            [ -n "$dep" ] || continue
            for guarded in $GUARDED; do
              if [ "$dep" = "$guarded" ]; then
                echo "hold: '$dep' is in the schema-emitting guard set" >> "$GITHUB_STEP_SUMMARY"
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done

          echo "auto-merge armed for $UPDATE_TYPE: $DEP_NAMES" >> "$GITHUB_STEP_SUMMARY"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.gate.outputs.eligible == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --rebase "$PR_URL"
